[project]
name = "TIPS-Treasury Basis"
description = "TIPS-Treasury arbitrage spread measuring relative value between TIPS and nominal Treasuries"
contributors = [
    "Jeremy Bejarano",
]
repo_url = "https://github.com/ftsfr/basis_tips_treas"
copyright = "2025"
os_compatibility = [
    "Windows/Linux/MacOS (Bloomberg required for inflation swaps)",
]

[notebooks.summary_basis_tips_treas]
name = "summary_basis_tips_treas"
description = "Summary statistics and visualization of TIPS-Treasury basis"
path = "_output/summary_basis_tips_treas.ipynb"
publishable = true

[dataframes.ftsfr_tips_treasury_basis]
name = "ftsfr_tips_treasury_basis"
description = "Daily TIPS-Treasury arbitrage spreads for 4 tenors"
sources = [
    "Federal Reserve",
    "Bloomberg",
]
providers = [
    "Federal Reserve",
    "Bloomberg",
]
contact_required = [
    "no",
]
pre_approved = [
    "No",
]
provider_links = [
    "https://federalreserve.gov",
    "https://bloomberg.com",
]
tags = [
    "TIPS",
    "Treasury",
    "arbitrage",
    "basis",
    "fixed income",
]
access_types = [
    "Public",
    "Bloomberg Terminal",
]
license = "Public / Bloomberg"
restrictions = "No"
pull_method = "Fed yields from public source, inflation swaps from Bloomberg"
path = "./_data/ftsfr_tips_treasury_basis.parquet"
date_col = "ds"
docs = """
## TIPS-Treasury Arbitrage Basis

Measures the spread between TIPS-implied risk-free rates and nominal Treasury yields.

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Tenor identifier (arb_2, arb_5, arb_10, arb_20) |
| ds | Date |
| y | Arbitrage spread in basis points |

### Methodology

TIPS-implied risk-free rate:
$$
\\text{TIPS-implied RF} = 10000 × (e^{r_{real} + ln(1 + π)} - 1)
$$

Arbitrage spread:
$$
\\text{Arb} = \\text{TIPS-implied RF} - \\text{Nominal Treasury}
$$

### Interpretation

- Positive: TIPS appear cheap relative to nominals
- Negative: TIPS appear expensive

### Data Sources

- Federal Reserve: GSW zero-coupon Treasury and TIPS yields
- Bloomberg: Treasury inflation swaps
"""

[charts.tips_treasury_spreads]
name = "TIPS-Treasury Spreads"
description = "Time series of TIPS-Treasury arbitrage spreads by tenor"
dataframe = "ftsfr_tips_treasury_basis"
path = "./_output/tips_treasury_spreads.html"
tags = [
    "TIPS",
    "Treasury",
    "arbitrage",
    "basis",
]
docs = """
## TIPS-Treasury Arbitrage Spreads

Time series plot showing the TIPS-Treasury arbitrage spreads across different maturities (2Y, 5Y, 10Y, 20Y).

### Interpretation

- Positive spreads indicate TIPS appear cheap relative to nominal Treasuries
- Negative spreads indicate TIPS appear expensive
- Spread widening often occurs during market stress
"""
